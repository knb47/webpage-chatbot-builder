{% extends 'base.html' %}

{% block title %}Config Builder{% endblock %}

{% block content %}
<div class="builder-wrap">
  <!-- Sessions: every build lives in a session you can come back to -->
  <aside class="pane sessions-pane">
    <header class="pane-head">
      <strong>Sessions</strong>
      <button id="new-session" class="btn btn-sm btn-outline-dark" title="Start a new agent">+ New</button>
    </header>
    <ul id="session-list" class="session-list"></ul>
  </aside>

  <!-- Config copilot chat -->
  <section class="pane chat-pane">
    <header class="pane-head">
      <strong>Config Copilot</strong>
      <span class="muted">describe your agent — I'll write the config</span>
    </header>
    <div id="chat-log" class="chat-log"></div>
    <form id="chat-form" class="chat-input">
      <div class="input-shell">
        <textarea id="chat-text" rows="1" placeholder="Describe the agent you want to build…" required></textarea>
        <button type="submit" id="chat-send" aria-label="Send" title="Send">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 13V3M8 3L3.5 7.5M8 3l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </form>
  </section>

  <!-- The working YAML -->
  <section class="pane yaml-pane">
    <header class="pane-head">
      <strong>config.yaml</strong>
      <span id="yaml-status" class="muted"></span>
    </header>
    <textarea id="yaml-editor" spellcheck="false">{{ starter_yaml }}</textarea>
    <footer class="save-bar">
      <input id="bot-name" class="form-control" placeholder="Chatbot name (e.g. sales_screener)" />
      <button id="save-btn" class="btn btn-success">Save to library</button>
      <a href="{% url 'deployments' %}" class="btn btn-outline-secondary">Deployments →</a>
    </footer>
    <div id="save-result" class="muted" style="padding: 4px 10px 8px; white-space: pre-wrap;"></div>
  </section>
</div>

<style>
  .builder-wrap { display: grid; grid-template-columns: 210px minmax(300px, 5fr) minmax(340px, 6fr); gap: 16px; height: calc(100vh - 140px);
    -webkit-font-smoothing: antialiased; }
  .pane { display: flex; flex-direction: column; border: 1px solid #e5e5e5; border-radius: 14px; background: #fff; overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .pane-head { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; display: flex; gap: 10px; align-items: center; justify-content: space-between;
    background: #fcfcfc; }
  .pane-head strong { font-size: .95em; letter-spacing: .01em; }
  .muted { color: #999; font-size: 0.8em; }

  /* Sessions */
  .session-list { list-style: none; margin: 0; padding: 8px; overflow-y: auto; flex: 1; }
  .session-list li { padding: 8px 10px; border-radius: 9px; cursor: pointer; font-size: 0.85em; display: flex; justify-content: space-between;
    gap: 6px; align-items: center; color: #444; border-left: 3px solid transparent; transition: background .12s; }
  .session-list li:hover { background: #f6f6f6; }
  .session-list li.active { background: #f0f0f0; border-left-color: #1a1a1a; font-weight: 600; color: #111; }
  .session-list .del { color: #ccc; cursor: pointer; font-size: .9em; padding: 2px 4px; border-radius: 5px; }
  .session-list .del:hover { color: #c0392b; background: #fbeaea; }
  #new-session { border-radius: 8px; font-size: .8em; }

  /* Chat */
  .chat-log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #fff; }
  .msg { padding: 10px 14px; border-radius: 14px; max-width: 90%; line-height: 1.5; overflow-wrap: anywhere; font-size: .93em; }
  .msg.user { background: #1a1a1a; color: #fff; align-self: flex-end; white-space: pre-wrap; border-bottom-right-radius: 4px; }
  .msg.assistant { background: #f4f4f5; align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.assistant p:last-child, .msg.assistant ul:last-child, .msg.assistant ol:last-child { margin-bottom: 0; }
  .msg.assistant pre { background: #e9e9eb; padding: 10px; border-radius: 8px; overflow-x: auto; font-size: .9em; }
  .msg.assistant code { background: #e9e9eb; border-radius: 4px; padding: 1px 5px; font-size: .9em; }
  .msg.thinking { color: #999; font-style: italic; background: transparent; padding-left: 2px; }

  /* Composer: pill input with an embedded round send button */
  .chat-input { padding: 12px 14px 14px; border-top: 1px solid #f0f0f0; background: #fff; }
  .input-shell { display: flex; align-items: flex-end; gap: 8px; border: 1px solid #ddd; border-radius: 16px; padding: 8px 8px 8px 14px;
    background: #fafafa; transition: border-color .15s, box-shadow .15s; }
  .input-shell:focus-within { border-color: #aaa; box-shadow: 0 0 0 3px rgba(0,0,0,.05); background: #fff; }
  .input-shell textarea { flex: 1; resize: none; border: 0; outline: none; background: transparent; padding: 4px 0; max-height: 140px;
    font-size: .93em; line-height: 1.45; }
  #chat-send { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; border: 0; background: #1a1a1a; color: #fff;
    display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .15s, transform .1s; }
  #chat-send:hover { background: #333; }
  #chat-send:active { transform: scale(.94); }
  #chat-send:disabled { background: #d4d4d4; cursor: default; }

  /* YAML pane */
  #yaml-editor { flex: 1; border: 0; padding: 16px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px;
    line-height: 1.5; resize: none; outline: none; background: #fbfbfb; color: #333; }
  .save-bar { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid #f0f0f0; background: #fff; }
  .save-bar input { max-width: 300px; border-radius: 10px; font-size: .9em; }
  .save-bar .btn { border-radius: 10px; font-size: .9em; }
  .save-bar .btn-success { background: #1f883d; border-color: #1f883d; }
  .save-bar .btn-success:hover { background: #1a7f37; }

  @media (max-width: 1000px) { .builder-wrap { grid-template-columns: 1fr; height: auto; } #yaml-editor { min-height: 320px; }
    .sessions-pane { max-height: 200px; } }
</style>
{% endblock %}

{% block extra_scripts %}
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
(function () {
  const log = document.getElementById('chat-log');
  const form = document.getElementById('chat-form');
  const text = document.getElementById('chat-text');
  const send = document.getElementById('chat-send');
  const editor = document.getElementById('yaml-editor');
  const yamlStatus = document.getElementById('yaml-status');
  const saveBtn = document.getElementById('save-btn');
  const botName = document.getElementById('bot-name');
  const saveResult = document.getElementById('save-result');
  const sessionList = document.getElementById('session-list');
  const newSessionBtn = document.getElementById('new-session');
  const STARTER = editor.value;

  let messages = [];
  let sessionId = null;

  const GREETING = "Hi! Tell me about the chat agent you want to build — who is it for and what should it do? I'll draft the config on the right as we talk.";

  function csrf() {
    const m = document.cookie.match(/csrftoken=([^;]+)/);
    return m ? m[1] : '';
  }
  function renderMarkdown(el, content) {
    if (window.marked && window.DOMPurify) {
      el.innerHTML = DOMPurify.sanitize(marked.parse(content));
    } else {
      el.textContent = content;
    }
  }
  function addMsg(role, content, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + (cls || role);
    if (role === 'assistant' && !cls) renderMarkdown(div, content);
    else div.textContent = content;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function resetToNewSession() {
    messages = [];
    sessionId = null;
    log.innerHTML = '';
    addMsg('assistant', GREETING);
    editor.value = STARTER;
    yamlStatus.textContent = '';
    saveResult.textContent = '';
    highlightActive();
  }

  function highlightActive() {
    sessionList.querySelectorAll('li').forEach(li =>
      li.classList.toggle('active', li.dataset.id == sessionId));
  }

  async function refreshSessions() {
    const res = await fetch("{% url 'copilot_sessions' %}");
    const data = await res.json();
    sessionList.innerHTML = '';
    data.sessions.forEach(s => {
      const li = document.createElement('li');
      li.dataset.id = s.id;
      const span = document.createElement('span');
      span.textContent = s.title;
      span.style.overflow = 'hidden'; span.style.textOverflow = 'ellipsis'; span.style.whiteSpace = 'nowrap';
      const del = document.createElement('span');
      del.className = 'del'; del.textContent = '✕'; del.title = 'Delete session';
      del.onclick = async (e) => {
        e.stopPropagation();
        await fetch(`{% url 'copilot_sessions' %}${s.id}/`, { method: 'DELETE', headers: { 'X-CSRFToken': csrf() } });
        if (sessionId == s.id) resetToNewSession();
        refreshSessions();
      };
      li.appendChild(span); li.appendChild(del);
      li.onclick = () => loadSession(s.id);
      sessionList.appendChild(li);
    });
    highlightActive();
  }

  async function loadSession(id) {
    const res = await fetch(`{% url 'copilot_sessions' %}${id}/`);
    if (!res.ok) return;
    const s = await res.json();
    sessionId = s.id;
    messages = s.messages || [];
    log.innerHTML = '';
    addMsg('assistant', GREETING);
    messages.forEach(m => addMsg(m.role, m.content));
    if (s.yaml) { editor.value = s.yaml; yamlStatus.textContent = 'restored'; }
    saveResult.textContent = '';
    highlightActive();
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const content = text.value.trim();
    if (!content) return;
    text.value = '';
    send.disabled = true;
    addMsg('user', content);
    messages.push({ role: 'user', content: content });
    const thinking = addMsg('assistant', 'Thinking…', 'assistant thinking');
    try {
      const res = await fetch("{% url 'copilot_chat' %}", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf() },
        body: JSON.stringify({ messages: messages, current_yaml: editor.value, session_id: sessionId }),
      });
      const data = await res.json();
      thinking.remove();
      if (!res.ok) throw new Error(data.error || res.statusText);
      addMsg('assistant', data.reply);
      messages.push({ role: 'assistant', content: data.reply });
      if (!sessionId && data.session_id) { sessionId = data.session_id; refreshSessions(); }
      if (data.yaml) {
        editor.value = data.yaml;
        yamlStatus.textContent = 'updated & validated ' + new Date().toLocaleTimeString();
      }
    } catch (err) {
      thinking.remove();
      addMsg('assistant', 'Something went wrong: ' + err.message, 'assistant thinking');
    } finally {
      send.disabled = false;
      text.focus();
    }
  });

  text.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  // Auto-grow the composer up to its max-height, shrink back after send.
  function autosize() {
    text.style.height = 'auto';
    text.style.height = Math.min(text.scrollHeight, 140) + 'px';
  }
  text.addEventListener('input', autosize);
  form.addEventListener('submit', () => setTimeout(autosize));

  saveBtn.addEventListener('click', async function () {
    saveResult.textContent = '';
    const name = botName.value.trim();
    if (!name) { saveResult.textContent = 'Give your chatbot a name first.'; return; }
    saveBtn.disabled = true;
    try {
      const res = await fetch("{% url 'copilot_save' %}", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf() },
        body: JSON.stringify({ chatbot_name: name, yaml: editor.value }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      saveResult.innerHTML = 'Saved as <strong>' + data.file_name +
        '</strong> — deploy it from the <a href="{% url "deployments" %}">Deployments</a> page.';
    } catch (err) {
      saveResult.textContent = 'Save failed: ' + err.message;
    } finally {
      saveBtn.disabled = false;
    }
  });

  newSessionBtn.addEventListener('click', resetToNewSession);

  resetToNewSession();
  refreshSessions();
})();
</script>
{% endblock %}
